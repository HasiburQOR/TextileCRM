server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        text/javascript;

    # ── API proxy → Django REST API backend ──────────────────────
    # Host is $http_host, not $host — nginx's $host strips the port, so
    # Django's request.build_absolute_uri() (used for factoryPackingList
    # and other absolute file URLs) would drop :5173 and produce an
    # unreachable http://localhost/... link.
    location /api/ {
        # Letterhead/logo uploads are multipart PATCH/POSTs — nginx's default
        # client_max_body_size of 1 MB 413s them before Django ever sees the
        # request. Keep in sync with LOGO_MAX_BYTES in
        # backend/apps/core/serializers.py.
        client_max_body_size 10m;
        proxy_pass http://backend-api:8000/api/;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  60s;
        proxy_connect_timeout 60s;
    }

    # ── Media proxy → Django media files ────────────────────────
    location /media/ {
        proxy_pass http://backend-api:8000/media/;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    # ── Cached static assets ────────────────────────────────────
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback — serve index.html for client-side routing ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
