# ─────────────────────────────────────────────────────────────────
# Shipment Sourcing App — Docker Compose (local development)
#
# Usage:
#   docker compose up --build       ← first time or after code changes
#   docker compose up                ← subsequent runs (uses cached images)
#   docker compose down -v           ← tear everything down incl. volumes
# ─────────────────────────────────────────────────────────────────

services:
  # ─── PostgreSQL Database (shared by both Django backends) ──────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${DB_PORT:-5432}:5432"

  # ─── Django REST API Backend (feeds frontend-admin) ──────────
  backend-api:
    build: ./backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_DB: backend_db
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-local-dev-secret-key-change-me}
    ports:
      - "${BACKEND_PORT:-8020}:8000"
    depends_on:
      db:
        condition: service_healthy

  # ─── Django Web App (HTMX templates + API) ───────────────────
  django-app:
    build: ./django_app
    restart: unless-stopped
    environment:
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_DB: django_app_db
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-local-dev-secret-key-change-me}
      DJANGO_DEBUG: "true"
      DJANGO_SEED_DATA: "true"
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    volumes:
      - django_media:/app/media
    depends_on:
      db:
        condition: service_healthy

  # ─── React Admin Panel (Vite build + nginx) ──────────────────
  frontend-admin:
    build:
      context: ./frontend-admin
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-5173}:80"
    depends_on:
      - backend-api

volumes:
  postgres_data:
  django_media:
