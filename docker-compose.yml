# ─────────────────────────────────────────────────────────────────
# Shipment Sourcing App — Docker Compose (local development)
#
# Usage:
#   docker compose up --build       ← first time or after code changes
#   docker compose up                ← subsequent runs (uses cached images)
#   docker compose down -v           ← tear everything down incl. volumes
# ─────────────────────────────────────────────────────────────────

services:
  # ─── PostgreSQL Database (shared by both Django backends) ──────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${DB_PORT:-5432}:5432"

  # ─── Django REST API Backend (feeds frontend-admin) ──────────
  backend-api:
    build: ./backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_DB: backend_db
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-local-dev-secret-key-change-me}
      # Only read by config.settings.prod (see docments/Deployment_Guide.md)
      # — harmless no-ops under the dev settings module used locally.
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # backend-api is only ever reached internally (via frontend-admin's
      # nginx proxy), never directly from the internet — TLS is terminated
      # at the reverse proxy in front of frontend-admin, so this service
      # forcing its own https redirect would break that internal hop.
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
    # Every uploaded file lives under MEDIA_ROOT (/app/media): the company
    # letterhead and seal/signature printed on each invoice, product photos
    # (the invoice's Foto column), factory packing lists, Document Vault
    # items. Without this volume that directory is part of the container's
    # writable layer, so a `docker compose up --build` silently destroys
    # every upload while the database rows keep pointing at the now-missing
    # files — the export then degrades to a document with no letterhead and
    # no seal, which is exactly how this was found.
    volumes:
      - media_data:/app/media
    ports:
      - "${BACKEND_PORT:-8020}:8000"
    depends_on:
      db:
        condition: service_healthy

  # ─── React Admin Panel (Vite build + nginx) ──────────────────
  frontend-admin:
    build:
      context: ./frontend-admin
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-5173}:80"
    depends_on:
      - backend-api

volumes:
  postgres_data:
  # Uploaded files (company letterhead + seal, product photos, documents).
  # Survives image rebuilds; `docker compose down -v` still clears it.
  media_data:
