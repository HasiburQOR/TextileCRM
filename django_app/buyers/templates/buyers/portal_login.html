{% extends "portal_base.html" %}
{% block title %}Buyer Portal Login{% endblock %}
{% block body %}
<div class="d-flex align-items-center justify-content-center vh-100 bg-light">
  <div class="card shadow-sm" style="width: 380px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-shop fs-1 text-primary"></i>
        <h4 class="mt-2 mb-0">Buyer Portal</h4>
        <div class="text-muted small">View your sourcing, invoices &amp; documents</div>
      </div>
      {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Portal Username</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
      </form>
      <div class="text-center mt-3">
        <a href="{% url 'accounts:login' %}" class="small text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Staff login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
