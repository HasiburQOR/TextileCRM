[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
addopts =
    --reuse-db
    --nomigrations
    -p no:warnings
    --strict-markers
    -v
markers =
    unit: fast, no DB access
    integration: hits DB / DRF client
    celery: exercises async tasks
    tenant: multi-tenant isolation tests
